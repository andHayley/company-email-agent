[project]
name = "company-email-agent"
version = "26.1.0"
description = "A personal AI agent for importing, searching, understanding, and managing enterprise email data."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "jsonschema>=4.20",
    "pytest>=8.0",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["company_email_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not archive and not docker and not historical_fixture' -q"
markers = [
    "archive: requires a locally provisioned email archive",
    "docker: uses an actual local Docker Engine",
    "historical_fixture: replays original model replies from private local fixtures",
    "live: makes real LLM calls (run with `uv run pytest -m live`)",
]
